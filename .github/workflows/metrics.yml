# Notable-contributions card (lowlighter/metrics).
# Requires a repo secret named METRICS_TOKEN: a classic PAT with no scopes
# (public data only). Settings -> Secrets and variables -> Actions.
# Run manually from the Actions tab (workflow_dispatch) after adding it.
name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notable:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Keonho-Chu
          filename: metrics.notable.svg
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
